version: "3.8"
services:
  db:
    image: library/postgres:13-alpine
    restart: always
    env_file:
      - .env.development
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      - app_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    env_file:
      - .env.development
    depends_on:
      - db
volumes:
  app_postgres: